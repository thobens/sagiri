[package]
name = "sagiri-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Detection and pseudonymization library for Sagiri"

[lints]
workspace = true

[dependencies]
getrandom = "0.4.3"
hmac = { version = "0.13.0", features = ["zeroize"] }
psl = "2.1.251"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = { version = "0.11.1", features = ["zeroize"] }
thiserror = "2.0.21"
toml = "0.9"
zeroize = "1.9.1"

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"
