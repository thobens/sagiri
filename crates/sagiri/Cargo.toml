[package]
name = "sagiri"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Sagiri obfuscates pasted text by replacing sensitive values with consistent, realistic-looking fake ones."
default-run = "sagiri"

[dependencies]
anyhow = "1.0.104"
arboard = { version = "3.7.0", features = ["wayland-data-control"] }
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
ratatui = "0.30.2"
sagiri-core = { version = "0.1.0", path = "../sagiri-core" }
signal-hook = "0.3"
unicode-width = "0.2.3"

[lints]
workspace = true

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = { version = "3.1.4", default-features = false }
tempfile = "3.27.0"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xfixes"] }
