[package]
name = "sagiri"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Sagiri obfuscates pasted text by replacing sensitive values with consistent, realistic-looking fake ones."

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
sagiri-core = { version = "0.1.0", path = "../sagiri-core" }

[lints]
workspace = true

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = { version = "3.1.4", default-features = false }
