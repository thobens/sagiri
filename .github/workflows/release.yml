name: Release

# A tag push builds, attests and publishes a release. A manual run is a dry run: it
# builds the same archives as workflow artifacts and publishes nothing. The steps that
# attest and publish are gated on the event, not on the ref, because a manual run can be
# started from a tag too.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Same versions as in audit.yml.
  CARGO_AUDIT_VERSION: 0.23.0
  CARGO_AUDITABLE_VERSION: 0.7.8

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install
      - name: Check the tag
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/release-tag-check.sh "$TAG"
      - run: scripts/check.sh

  build:
    needs: verify
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - name: Check that the runner builds natively for the target
        run: |
          host="$(rustc -vV | sed -n 's/^host: //p')"
          if [ "$host" != "$TARGET" ]; then
            echo "the runner builds for $host, not for $TARGET" >&2
            exit 1
          fi
      - run: >-
          cargo install --locked
          cargo-audit@$CARGO_AUDIT_VERSION
          cargo-auditable@$CARGO_AUDITABLE_VERSION
      - run: make release CARGO='cargo auditable'
      - run: >-
          scripts/audit.sh
          target/release/sagiri
          target/release/sagiri-cli
          target/release/sagiri-session
      - id: package
        run: echo "archive=$(scripts/package.sh "$TARGET")" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance
        if: github.event_name == 'push'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.archive }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sagiri-${{ matrix.target }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sagiri-*
          path: dist
          merge-multiple: true
      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          shopt -s nullglob
          archives=(*.tar.gz)
          if [ "${#archives[@]}" -ne 3 ]; then
            echo "expected 3 archives, found ${#archives[@]}" >&2
            exit 1
          fi
          sha256sum -- "${archives[@]}" > SHA256SUMS
          cat SHA256SUMS
      - name: Remove a draft of an earlier run, refuse a published release
        run: |
          releases="$(gh api --paginate "repos/$GH_REPO/releases" \
            --jq '.[] | select(.tag_name == env.TAG) | "\(.id) \(.draft)"')"
          if printf '%s\n' "$releases" | grep -q ' false$'; then
            echo "a published release for $TAG exists; it cannot be changed" >&2
            exit 1
          fi
          while read -r id draft; do
            if [ -n "$id" ] && [ "$draft" = true ]; then
              echo "deleting draft release $id for $TAG"
              gh api --method DELETE "repos/$GH_REPO/releases/$id"
            fi
          done <<< "$releases"
      - name: Create the draft release
        run: >-
          gh release create "$TAG"
          --draft --verify-tag --generate-notes
          --title "Sagiri ${TAG#v}"
      - name: Upload the archives and SHA256SUMS
        run: gh release upload "$TAG" dist/*.tar.gz dist/SHA256SUMS
      - name: Publish the release
        run: gh release edit "$TAG" --draft=false
